# ─── Build settings ───────────────────────────────────────────────────────────
[build]
  command   = "npm run build"
  publish   = "dist"

[build.environment]
  NODE_VERSION = "20"

# ─── SPA routing — every path falls back to index.html ───────────────────────
[[redirects]]
  from = "/api/*"
  to = "http://scribeai-backend-prod.eba-jjebgtut.ap-south-1.elasticbeanstalk.com/api/:splat"
  status = 200
  force = true

