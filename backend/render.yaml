services:
  - type: web
    name: scribeai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free          # change to "starter" ($7/mo) for always-on
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://meetscribeai.netlify.app
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
